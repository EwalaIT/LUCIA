version: "3.9"

services:
  # -----------------------------
  # LibreChat Backend
  # -----------------------------
  librechat-backend:
    container_name: librechat-backend
    build:
      context: .
      dockerfile: docker/librechat-api.Dockerfile
    env_file:
      - /env/librechat.env
      - /env/lucia.env
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml
      - ./librechat/.env:/app/.env
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    ports:
      - "${LIBRECHAT_API_PORT}:3080"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - meilisearch
    networks:
      - lucia-net

  # -----------------------------
  # LibreChat Frontend
  # -----------------------------
  librechat-frontend:
    container_name: librechat-frontend
    build:
      context: .
      dockerfile: docker/librechat-client.Dockerfile
    env_file:
      - /env/lucia.env
      - /env/librechat.env
    volumes:
      - ./librechat/client:/app
    ports:
      - "${LIBRECHAT_CLIENT_PORT}:3090"
    restart: unless-stopped
    depends_on:
      - librechat-backend
    networks:
      - lucia-net

  # -----------------------------
  # Setup Wizard Backend
  # -----------------------------
  setup-wizard-backend:
    container_name: setup-wizard-backend
    build:
      context: .
      dockerfile: docker/setup-wizard-backend.Dockerfile
    env_file:
      - /env/lucia.env
    volumes:
      - lucia-sqlite-db:/data/db
    ports:
      - "${SETUP_WIZARD_BACKEND_PORT}:8080"
    restart: unless-stopped
    networks:
      - lucia-net

  # -----------------------------
  # Setup Wizard Frontend
  # -----------------------------
  setup-wizard-frontend:
    container_name: setup-wizard-frontend
    build:
      context: .
      dockerfile: docker/setup-wizard-frontend.Dockerfile
    env_file:
      - /env/lucia.env
    ports:
      - "${SETUP_WIZARD_FRONTEND_PORT}:80"
    restart: unless-stopped
    depends_on:
      - setup-wizard-backend
    networks:
      - lucia-net

  # -----------------------------
  # LangChain Backend
  # -----------------------------
  langchain-backend:
    build:
      context: .
      dockerfile: docker/langchain-backend.Dockerfile
    env_file:
      - /env/lucia.env
    volumes:
      - lucia-sqlite-db:/data/db
    ports:
      - "${LANGCHAIN_API_PORT}:8000"
    restart: unless-stopped
    networks:
      - lucia-net

  # -----------------------------
  # LangChain MCP
  # -----------------------------
  langchain-mcp:
    build:
      context: .
      dockerfile: docker/langchain-mcp.Dockerfile
    env_file:
      - /env/lucia.env
    volumes:
      - lucia-sqlite-db:/data/db
    ports:
      - "${LANGCHAIN_MCP_PORT}:8001"
    restart: unless-stopped
    networks:
      - lucia-net

  # -----------------------------
  # MongoDB
  # -----------------------------
  mongodb:
    container_name: chat-mongodb
    image: mongo
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data-node:/data/db
    # ports:
    #   - "27017:27017"
    command: mongod --noauth
    networks:
      - lucia-net

  # -----------------------------
  # MeiliSearch
  # -----------------------------
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.12.3
    restart: always
    user: "${UID}:${GID}"
    env_file:
      - /env/librechat.env
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_HOST=http://meilisearch:7700
    # ports:
    #   - "7700:7700"
    volumes:
      - ./meili_data_v1.12:/meili_data

  rag_api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - /env/librechat.env
    networks:
      - lucia-net

  # -----------------------------
  # VectorDB (Postgres + pgvector)
  # -----------------------------
  vectordb:
    container_name: vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
    networks:
      - lucia-net

volumes:
  pgdata2:
  lucia-sqlite-db:

networks:
  lucia-net:
    driver: bridge